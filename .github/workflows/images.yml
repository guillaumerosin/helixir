# Construit et publie les images sur GHCR (ghcr.io/<owner>/helixir:<flavor>).
# Déclenché manuellement ou sur un tag v*. Les images publiées permettent
# `helixir install` en quelques minutes (pull) au lieu d'un build local.
name: images

on:
  workflow_dispatch:
    inputs:
      flavors:
        description: "Flavors à construire (JSON)"
        default: '["light","rna","dna","meta","prot","full"]'
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(github.event.inputs.flavors || '["light","rna","dna","meta","prot","full"]') }}
    steps:
      - uses: actions/checkout@v4

      # Les runners gratuits n'ont qu'environ 14 Go libres : insuffisant pour full.
      - name: Libérer de l'espace disque
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - name: Domaines de la flavor
        id: meta
        run: |
          pip install -e . >/dev/null
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          from helixir.flavors import get_flavor
          print("domains=" + " ".join(get_flavor("${{ matrix.flavor }}").domains))
          EOF
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: src/helixir/images
          push: true
          build-args: |
            FLAVOR=${{ matrix.flavor }}
            DOMAINS=${{ steps.meta.outputs.domains }}
            HELIXIR_VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/helixir:${{ matrix.flavor }}
          cache-from: type=gha,scope=${{ matrix.flavor }}
          cache-to: type=gha,mode=max,scope=${{ matrix.flavor }}
